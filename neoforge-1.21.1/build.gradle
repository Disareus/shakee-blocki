plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    compileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    compileOnly "maven.modrinth:embeddium:1.0.15+mc1.21.1"
}

def modVersion = project.version.toString()

processResources {
    inputs.property "version", modVersion

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The shared `common` sources contain only pure cross-platform logic.
sourceSets {
    main {
        java {
            srcDir "../common/src/main/java"
        }
        resources {
            srcDir "../common/src/main/resources"
        }
    }
}

neoForge {
    version = project.neoforge_version

    mods {
        "${project.archives_base_name}" {
            sourceSet sourceSets.main
        }
    }
}
